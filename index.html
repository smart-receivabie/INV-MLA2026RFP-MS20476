<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secured Document Notification</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f3f3f3;
    }

    .page {
      position: relative;
      width: min(100%, 560px);
      aspect-ratio: 14 / 9;
      overflow: hidden;
      background: #f3f3f3;
    }

    .letter {
      position: absolute;
      inset: 8.333% 5.357%;
      border: 1px solid #d8d8d8;
      background: #fff;
      box-shadow: 0 1px 2px rgb(0 0 0 / 8%);
    }

    .header {
      height: 21.333%;
      display: grid;
      place-items: center;
      background: #11264d;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 160px;
      padding: 10px 16px 10px 10px;
      background: #fff;
    }

    .brand-mark {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      background: #0089d0;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      line-height: 1;
    }

    .brand-name {
      color: #0078c9;
      font-size: 16px;
      line-height: 1;
    }

    .content {
      padding-top: 16px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #111;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
    }

    .details {
      width: 80%;
      margin: 15px auto 0;
      padding: 11px 16px 13px;
      background: #e9e9e9;
      font-size: 10px;
      line-height: 1.6;
    }

    .details p {
      margin: 0;
    }

    .button {
      display: inline-flex;
      width: 40%;
      min-height: 33px;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
      border: 0;
      background: #8b2bd1;
      color: #fff;
      font: 700 10px/1 Arial, Helvetica, sans-serif;
      letter-spacing: 0.12em;
      text-decoration: none;
      text-transform: uppercase;
    }

    @media (max-width: 500px) {
      body {
        padding: 10px;
      }

      .brand {
        min-width: 0;
        padding: 7px 11px 7px 7px;
      }

      .brand-mark {
        width: 22px;
        height: 22px;
        font-size: 14px;
      }

      .brand-name {
        font-size: 14px;
      }

      .content {
        padding-top: 10px;
      }

      .details {
        margin-top: 9px;
        padding: 7px 8px;
        font-size: clamp(7px, 2vw, 10px);
        line-height: 1.5;
      }

      .button {
        min-height: 27px;
        margin-top: 12px;
        font-size: clamp(7px, 2vw, 10px);
      }
    }

    @media print {
      @page {
        size: 560px 360px;
        margin: 0;
      }

      body {
        padding: 0;
      }

      .page {
        width: 560px;
      }
    }
  </style>
